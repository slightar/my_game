<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <style>.bg{fill:#1c1f22}.panel{fill:#eff0ed}.dark{fill:#282d31}.blue{fill:#0099cc}.line{stroke:#a8b1b7;stroke-width:2}.t{font-family:'Microsoft YaHei',sans-serif}.white{fill:#f5f6f3}.ink{fill:#20262d}.muted{fill:#9da6ac}.h{font-size:30px;font-weight:700}.m{font-size:20px}.s{font-size:15px}.note{fill:#fff8e8;stroke:#b67b26;stroke-width:2}</style>
