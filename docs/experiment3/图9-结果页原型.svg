<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <style>.bg{fill:#1c1f22}.panel{fill:#eff0ed}.dark{fill:#282d31}.blue{fill:#0099cc}.orange{fill:#dd702d}.t{font-family:'Microsoft YaHei',sans-serif}.white{fill:#fff}.ink{fill:#20262d}.muted{fill:#8f999f}.h{font-size:34px;font-weight:700}.m{font-size:20px}.s{font-size:15px}.note{fill:#fff8e8;stroke:#b67b26;stroke-width:2}</style>
  <rect width="1280" height="720" class="bg"/><rect x="65" y="80" width="1150" height="545" class="dark"/>
  <text x="640" y="150" text-anchor="middle" class="t white h">行动完成</text><text x="640" y="185" text-anchor="middle" class="t muted m">弑君者已击败 · 用时 02:47</text>
  <rect x="125" y="235" width="430" height="220" class="panel"/><text x="160" y="280" class="t ink m">战斗记录</text><text x="160" y="325" class="t ink s">出战角色：德克萨斯</text><text x="160" y="357" class="t ink s">承受伤害：2　技能使用：5</text><text x="160" y="389" class="t ink s">旁白触发：3　API 降级：0</text><text x="160" y="421" class="t ink s">获得：档案「初次呼叫」</text>
  <rect x="590" y="235" width="565" height="220" class="panel"/><text x="625" y="280" class="t ink m">最后旁白</text><text x="872" y="338" text-anchor="middle" class="t ink m">“好吧，这一次不是运气。”</text><text x="625" y="390" class="t muted s">情绪：克制赞许　来源：AI 动态旁白</text><text x="625" y="423" class="t muted s">可在设置中关闭旁白或语音朗读</text>
  <rect x="125" y="500" width="290" height="65" class="panel"/><text x="270" y="540" text-anchor="middle" class="t ink m">重新挑战</text><rect x="470" y="500" width="290" height="65" class="blue"/><text x="615" y="540" text-anchor="middle" class="t white m">进入下一节点</text><rect x="815" y="500" width="290" height="65" class="panel"/><text x="960" y="540" text-anchor="middle" class="t ink m">返回首页</text>
  <rect x="370" y="640" width="540" height="58" rx="8" class="note"/><text x="640" y="665" text-anchor="middle" class="t ink s">正常结果提供重试、下一关和返回；失败结果将“下一节点”替换为“调整角色”</text><text x="640" y="688" text-anchor="middle" class="t ink s">按钮均可键盘选择，执行前显示当前焦点</text>
</svg>
