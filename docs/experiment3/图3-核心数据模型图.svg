<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#40566b"/></marker></defs>
  <style>.bg{fill:#fff}.box{fill:#f8fafb;stroke:#40566b;stroke-width:2}.saved{fill:#edf7ee;stroke:#4b7f52;stroke-width:2}.planned{fill:#fff4df;stroke:#b67b26;stroke-width:2}.t{font-family:'Microsoft YaHei',sans-serif;fill:#20262d}.h{font-size:26px;font-weight:700;text-anchor:middle}.m{font-size:18px;font-weight:700}.s{font-size:15px}.line{stroke:#40566b;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect class="bg" width="1280" height="800"/><text x="640" y="42" class="h t">核心数据对象及关系</text>
  <g transform="translate(70 90)"><rect width="300" height="220" rx="12" class="saved"/><text x="20" y="35" class="t m">GameProgress（持久化）</text><text x="20" y="70" class="t s">version</text><text x="20" y="96" class="t s">unlockedNodes / completedNodes</text><text x="20" y="122" class="t s">currentNode / archiveIds</text><text x="20" y="148" class="t s">equipmentIds / slots</text><text x="20" y="174" class="t s">truth / compliance / memory</text><text x="20" y="200" class="t s">normalComplete / hiddenComplete</text></g>
  <g transform="translate(490 90)"><rect width="300" height="220" rx="12" class="box"/><text x="20" y="35" class="t m">MapNode（静态定义）</text><text x="20" y="70" class="t s">id / chapterId / name / type</text><text x="20" y="96" class="t s">objective / description</text><text x="20" y="122" class="t s">reward / exits</text><text x="20" y="148" class="t s">unlock conditions</text><text x="20" y="183" class="t s">1..* 属于 StoryChapter</text></g>
  <g transform="translate(910 90)"><rect width="300" height="220" rx="12" class="saved"/><text x="20" y="35" class="t m">Character（持久化）</text><text x="20" y="70" class="t s">id / name / description</text><text x="20" y="96" class="t s">assets / stats / attack</text><text x="20" y="122" class="t s">skills[0..2]</text><text x="20" y="148" class="t s">schemaVersion / image paths</text><text x="20" y="183" class="t s">运行时由 CharacterRuntime 使用</text></g>
  <g transform="translate(70 470)"><rect width="300" height="180" rx="12" class="saved"/><text x="20" y="35" class="t m">GameSettings（持久化）</text><text x="20" y="70" class="t s">key bindings[11]</text><text x="20" y="96" class="t s">masterVolume / soundVolume</text><text x="20" y="122" class="t s">输入限制与重复键校验</text></g>
  <g transform="translate(490 440)"><rect width="300" height="235" rx="12" class="planned"/><text x="20" y="35" class="t m">NarrationRequest（瞬时）</text><text x="20" y="70" class="t s">mode / node / character / boss</text><text x="20" y="96" class="t s">event / hp / recentSkill</text><text x="20" y="122" class="t s">lastNarration</text><text x="20" y="160" class="t m">NarrationResult（缓存）</text><text x="20" y="192" class="t s">text / emotion / requestId</text></g>
  <g transform="translate(910 440)"><rect width="300" height="235" rx="12" class="planned"/><text x="20" y="35" class="t m">CharacterGenerationRequest</text><text x="20" y="70" class="t s">image / name</text><text x="20" y="96" class="t s">attack / skillE / skillQ</text><text x="20" y="132" class="t m">GenerationResult</text><text x="20" y="164" class="t s">previewUrl / Character JSON</text><text x="20" y="190" class="t s">warnings / requestId</text></g>
  <path d="M370 190 L490 190" class="line"/><text x="400" y="175" class="t s">选择/完成</text>
  <path d="M790 200 L910 200" class="line"/><text x="814" y="184" class="t s">奖励/解锁</text>
  <path d="M940 440 L1040 310" class="line"/><text x="990" y="375" class="t s">确认后生成</text>
  <path d="M640 440 L640 310" class="line"/><text x="655" y="382" class="t s">读取战况</text>
  <text x="640" y="755" class="h t" style="font-size:16px">绿色：保存到本地 JSON　黄色：计划接入 AI 后产生的数据</text>
</svg>
