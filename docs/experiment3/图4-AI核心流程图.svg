<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#40566b"/></marker></defs>
  <style>.bg{fill:#fff}.n{fill:#f7f9fb;stroke:#40566b;stroke-width:2}.ai{fill:#fff4df;stroke:#b67b26;stroke-width:2}.ok{fill:#edf7ee;stroke:#4b7f52;stroke-width:2}.d{fill:#fff;stroke:#40566b;stroke-width:2}.t{font-family:'Microsoft YaHei',sans-serif;fill:#20262d;text-anchor:middle}.h{font-size:26px;font-weight:700}.m{font-size:17px}.s{font-size:14px}.line{stroke:#40566b;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect class="bg" width="1280" height="860"/><text x="640" y="42" class="t h">AI 旁白与角色生成核心流程</text>
  <rect x="60" y="105" width="190" height="70" rx="12" class="n"/><text x="155" y="147" class="t m">玩家进入游戏</text>
  <polygon points="350,105 455,140 350,175 245,140" class="d"/><text x="350" y="146" class="t m">选择 AI 功能</text>
  <rect x="500" y="80" width="220" height="85" rx="12" class="n"/><text x="610" y="116" class="t m">战斗关键事件</text><text x="610" y="142" class="t s">残血/技能/Boss 结算</text>
  <rect x="500" y="205" width="220" height="85" rx="12" class="n"/><text x="610" y="240" class="t m">提交角色资料</text><text x="610" y="266" class="t s">图片/名称/攻击/技能</text>
  <rect x="800" y="130" width="225" height="95" rx="12" class="ai"/><text x="912" y="167" class="t m">组装并校验请求</text><text x="912" y="193" class="t s">字段、大小、限流、去敏</text>
  <rect x="800" y="290" width="225" height="85" rx="12" class="ai"/><text x="912" y="327" class="t m">异步调用 API 网关</text><text x="912" y="353" class="t s">超时与错误捕获</text>
  <polygon points="912,430 1025,475 912,520 799,475" class="d"/><text x="912" y="469" class="t m">响应合法？</text><text x="912" y="493" class="t s">内容与结构校验</text>
  <rect x="500" y="420" width="220" height="95" rx="12" class="ok"/><text x="610" y="457" class="t m">生成结果预览</text><text x="610" y="483" class="t s">旁白字幕或角色方案</text>
  <polygon points="610,570 720,615 610,660 500,615" class="d"/><text x="610" y="609" class="t m">需要玩家确认？</text><text x="610" y="633" class="t s">角色必须确认</text>
  <rect x="835" y="590" width="225" height="80" rx="12" class="n"/><text x="947" y="627" class="t m">本地降级</text><text x="947" y="651" class="t s">预设旁白/默认参数/重试</text>
  <rect x="500" y="720" width="220" height="80" rx="12" class="ok"/><text x="610" y="756" class="t m">显示旁白或保存角色</text><text x="610" y="781" class="t s">战斗继续，本地规则执行</text>
  <path d="M250 140 L245 140" class="line"/><path d="M455 130 L500 122" class="line"/><text x="477" y="105" class="t s">旁白</text>
  <path d="M430 160 L500 225" class="line"/><text x="468" y="202" class="t s">角色</text>
  <path d="M720 122 L800 155" class="line"/><path d="M720 248 L800 205" class="line"/><path d="M912 225 L912 290" class="line"/><path d="M912 375 L912 430" class="line"/>
  <path d="M799 475 L720 470" class="line"/><text x="760" y="453" class="t s">是</text>
  <path d="M960 520 L960 590" class="line"/><text x="980" y="558" class="t s">否/超时</text>
  <path d="M610 515 L610 570" class="line"/><path d="M610 660 L610 720" class="line"/><text x="635" y="694" class="t s">确认/旁白无需确认</text>
  <path d="M835 630 L720 747" class="line"/>
</svg>
